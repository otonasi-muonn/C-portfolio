name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ソースコードをチェックアウト
        uses: actions/checkout@v6

      - name: GCC バージョン確認
        run: gcc --version

      - name: ビルド＆HTML生成
        run: make all

      - name: Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
